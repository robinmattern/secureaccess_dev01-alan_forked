<!DOCTYPE html>
<html>
<head>
    <title>Connection Test</title>
</head>
<body>
    <h1>Testing Server Connection</h1>
    <div id="results"></div>

<!--<script src="_config.js"></script>                             --><!--#.(51210.02.2) -->
    <script src="./client/c01_client-first-app/_config.js"></script>  <!-- .(51210.02.2 RAM ???) -->

    <script>
        async function testConnection() {
            const results = document.getElementById('results');
            
            try {
                window.FVARS.SECURE_HOST           = window.FVARS.SECURE_API_URL.replace( /\/api/, '');      
                console.log(`Testing connection to ${window.FVARS.SECURE_HOST}/health` );                 // .(51108.01.3 RAM Should be: SECURE_API_URL/health)
                const response = await fetch(     `${window.FVARS.SECURE_HOST}/health`, {                 // .(51110.03.1 RAM Include creds).(51108.01.4 RAM Was: http://localhost:3001/health)
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    credentials: 'include'
                });
                const data = await response.json();
                
                results.innerHTML = `
                    <p style="color: green;">✅ Connection successful!</p>
                    <p>Status: ${data.status}</p>
                    <p>Timestamp: ${data.timestamp}</p>
                `;
            } catch (error) {
                results.innerHTML = `
                    <p style="color: red;">❌ Connection failed!</p>
                    <p>Error: ${error.message}</p>
                `;
                console.error('Connection error:', error);
            }
        }
        
        testConnection();
    </script>
</body>
</html>
