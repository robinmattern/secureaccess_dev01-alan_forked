<!DOCTYPE html>
<html>
<head>
    <title>Auth Test</title>
</head>
<body>
    <h1>Authentication Test</h1>
    <div id="result"></div>

<!--<script src="_config.js"></script>                             --><!--#.(51210.02.1) -->
    <script src="./client/c01_client-first-app/_config.js"></script>  <!-- .(51210.02.1 RAM ???) -->
    <script>
        async function testAuth() {
            try {
                const response = await fetch(`${window.FVARS.SERVER_API_URL}/auth/verify`, {                // .(51108.01.1 RAM Was: http://localhost:3000/api/auth/verify)
                    method: 'GET',
                    credentials: 'include'
                });
                
                const data = await response.json();
                document.getElementById('result').innerHTML = `
                    <h3>Response Status: ${response.status}</h3>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                document.getElementById('result').innerHTML = `
                    <h3>Error:</h3>
                    <pre>${error.message}</pre>
                `;
            }
        }
        
        // Test immediately
        testAuth();
    </script>
</body>
</html>
